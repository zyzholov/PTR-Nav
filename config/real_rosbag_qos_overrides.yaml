# QoS overrides for real-robot rosbag recording.
# Sensor and cloud topics are kept best-effort compatible so the recorder can
# be started before the publishers appear without missing best-effort streams.

/tf:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 100

/tf_static:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 100

/rosout:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 1000

/livox/lidar:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 200

