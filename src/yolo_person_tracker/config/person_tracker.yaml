yolo_person_tracker:
  ros__parameters:
    video_path: /home/z/Videos/track_camera_view.mp4
    model_path: /home/z/workspace_zyz/yolo_v8_man_detection/ultralytics-main/yolov8n.pt
    ultralytics_root: /home/z/workspace_zyz/yolo_v8_man_detection/ultralytics-main
    backend: yolo
    device: "0"
    half: true
    async_inference: true
    warmup: true
    target_class_names: person,man,pedestrian
    conf_thres: 0.35
    iou_thres: 0.45
    imgsz: 640
    extract_contours: true
    contour_max_side: 128
    contour_max_points: 36
    contour_interval: 2
    max_fps: 60.0
    realtime_playback: true
    max_frame_skip: 3
    frame_scale: 1.0
    loop_video: true
    show_window: true
    window_scale: 1.0
    publish_annotated: true
    publish_image_stride: 2
    trail_length: 180
    ghost_max_count: 18
    ghost_alpha: 0.36
    ghost_recent_skip: 8
    ghost_min_spacing_px: 20.0
    ghost_path_alpha: 0.0
    draw_camera_trajectory: true
    camera_trajectory_alpha: 0.30
    camera_trajectory_width_ratio: 0.30
    camera_trajectory_origin_y_ratio: 0.96
    camera_trajectory_horizon_y_ratio: 0.62
    camera_trajectory_curve: 0.0
    camera_trajectory_target_weight: 0.72
    camera_motion_max_width: 480
    camera_motion_roi_y_ratio: 0.46
    camera_motion_smoothing: 0.82
    camera_motion_yaw_gain_px: 10.0
    camera_motion_update_stride: 2
    max_missing_frames: 12
    match_max_distance_px: 150.0
    prediction_horizon_sec: 0.0
    prediction_step_sec: 0.1
    safety_stop_area_ratio: 0.18
    max_frames: 0
