terrain_nav_node:
  ros__parameters:
    use_sim_time: true

    odom_topic: /Odometry
    fused_map_topic: /car_0_terrain_analyzer/fused_map
    cmd_topic: /hunter_se/cmd_vel
    frame_id: map

    wheel_base: 0.549
    max_steer: 0.5236
    max_steer_rate: 4.0
    max_speed: 2.8
    min_speed: 0.0
    desired_speed: 2.05
    min_tracking_speed: 0.95
    goal_slowdown_distance: 0.85
    max_accel: 4.0

    footprint_front: 0.42
    footprint_back: 0.42
    footprint_half_width: 0.313
    footprint_margin: 0.10

    yaw_bins: 72
    primitive_length: 0.42
    integration_step: 0.10
    max_search_time_ms: 110.0
    max_iterations: 24000
    goal_tolerance: 0.42
    goal_yaw_tolerance: 0.95
    local_goal_distance: 8.0
    local_goal_bearing_limit: 1.55
    direct_goal_bearing_limit: 1.90
    guide_search_enable: true
    guide_max_expansions: 9000
    guide_min_distance: 2.2
    guide_boundary_margin: 0.9
    guide_progress_weight: 2.4
    guide_goal_weight: 0.45
    guide_lateral_weight: 0.85
    guide_clearance_weight: 1.05
    guide_path_cost_weight: 0.075
    guide_follow_weight: 1.25
    guide_heading_weight: 0.95
    direct_curve_enable: true
    direct_curve_max_length_ratio: 1.30
    direct_curve_max_lateral_ratio: 0.30
    direct_curve_clearance_weight: 7.8

    risk_free_threshold: 0.08
    risk_hard_threshold: 0.58
    risk_query_mode: flat_2d
    se2_risk_layer: risk
    hard_risk_layer: baseline_risk
    unknown_cost: 60.0
    allow_unknown: true
    risk_weight: 3.6
    clearance_distance: 1.10
    clearance_weight: 6.2
    comfort_clearance_distance: 2.25
    comfort_clearance_weight: 8.8
    comfort_clearance_risk_threshold: 0.14
    steer_weight: 0.82
    steer_change_weight: 1.40
    steer_reversal_weight: 2.20
    smoothing_passes: 2
    shortcut_smoothing_enable: true
    reference_resample_spacing: 0.22
    reference_smooth_iterations: 64
    reference_smooth_step: 0.24
    reference_anchor_weight: 0.11
    reference_smooth_weight: 1.22
    reference_curvature_weight: 0.46
    reference_max_curvature_ratio: 0.98
    heuristic_weight: 1.15
    progress_weight: 1.70
    path_lateral_weight: 0.28
    goal_heading_weight: 0.46
    backtrack_reject_distance: 0.45
    max_extra_path_ratio: 2.35
    accept_partial_progress: true

    replan_min_interval: 0.55
    replan_path_remaining: 2.20
    replan_track_error: 0.58
    replan_goal_shift: 0.35
    rolling_goal_update_distance: 2.80
    command_timeout_sec: 0.50
    command_filter_alpha: 0.82
    odom_speed_from_pose: true
    odom_speed_filter_alpha: 0.55
    odom_pose_prediction_time: 0.08
    stanley_gain: 1.45
    stanley_softening: 0.75
    pure_pursuit_weight: 0.42
    steer_output_sign: 1.0

    use_mppi: false
    control_period: 0.04
    mppi_dt: 0.10
    mppi_steps: 24
    mppi_batch_size: 320
    mppi_speed_std: 0.32
    mppi_steer_std: 0.38
    mppi_path_weight: 12.0
    mppi_heading_weight: 3.0
    mppi_goal_weight: 1.2
    mppi_risk_weight: 22.0
    mppi_clearance_weight: 4.0
    mppi_control_weight: 0.08
    mppi_rate_weight: 0.16
    mppi_progress_weight: 3.8
    mppi_speed_tracking_weight: 1.35
    mppi_collision_cost: 100000.0
    mppi_lookahead_base: 0.45
    mppi_lookahead_time: 0.45
    terrain_speed_enable: true
    terrain_speed_min_scale: 0.70
    terrain_risk_slowdown_weight: 0.25
    terrain_clearance_slowdown_weight: 0.15
    path_commit_enable: false
    path_commit_distance: 0.0
    path_commit_min_distance: 0.0
    path_commit_max_track_error: 0.12
    publish_candidate_debug: false
